name: Release (tag) -> Publish to Comfy Registry

# Publishes only when a semantic version tag (vX.Y.Z) is pushed. Bump the
# version in pyproject.toml, then create and push a matching tag:
#   git tag v0.1.2 && git push origin v0.1.2
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install dependencies
      run: |
        cd ui
        npm install

    - name: Build React extension
      run: |
        cd ui
        npm run build

    - name: Verify tag matches pyproject version
      run: |
        tag="${GITHUB_REF_NAME}"
        ver="$(grep -E '^version = ' pyproject.toml | head -n1 | sed -E 's/version = "([^"]+)"/\1/')"
        if [ "$tag" != "v${ver}" ]; then
          echo "Tag '${tag}' does not match pyproject version 'v${ver}'"
          exit 1
        fi
        echo "Tag '${tag}' matches pyproject version 'v${ver}'"

    - name: Publish Custom Node
      uses: Comfy-Org/publish-node-action@main
      with:
        personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        skip_checkout: 'true'
