name: CI (build + test, no publish)

# Runs on every push/PR to main to validate the codebase. Never publishes.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: |
        cd ui
        npm install

    - name: Build React extension
      run: |
        cd ui
        npm run build

    - name: Frontend unit tests
      run: |
        cd ui
        npm test

    # Backend tests skip automatically when torch is unavailable on the runner.
    - name: Backend unit tests
      run: |
        python -m unittest discover -s tests -v
